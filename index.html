<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart MedOS | Realistic 3D Simulation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Tajawal:wght@500;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --chassis-body: #181d28;
            --chassis-rim: #2a3449;
            --chassis-cavity: #080a0f;
            --lid-surface: linear-gradient(145deg, #242f44, #151d2c);
            --border-specular: rgba(255, 255, 255, 0.12);
            --led-active: #00ffcc;
            --led-glow: rgba(0, 255, 204, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center top, #0f1523 0%, #03060b 100%);
            min-height: 100vh;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            padding: 30px 16px 80px;
            overflow-x: hidden;
        }

        .main-shell {
            width: 100%;
            max-width: 1140px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* شريط التحكم العلوي */
        .system-bar {
            background: rgba(18, 24, 38, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-specular);
            border-radius: 16px;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .system-bar h1 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.2px;
            color: #ffffff;
        }

        .bar-tools {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .clock-screen {
            font-family: 'Share Tech Mono', monospace;
            font-size: 15px;
            color: var(--led-active);
            background: #06090e;
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 204, 0.25);
            text-shadow: 0 0 10px var(--led-glow);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .clock-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--led-active);
            box-shadow: 0 0 8px var(--led-active);
        }

        .lang-btn {
            background: #1e293b;
            color: #ffffff;
            border: 1px solid var(--border-specular);
            padding: 7px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lang-btn:hover { background: #334155; }

        /* مسرح المحاكاة ثلاثية الأبعاد للعلبة الحقيقية */
        .viewport-3d {
            perspective: 1400px;
            display: flex;
            justify-content: center;
            padding: 10px 0;
        }

        .device-chassis {
            width: 100%;
            background: var(--chassis-body);
            border-radius: 28px;
            border: 4px solid var(--chassis-rim);
            padding: 26px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px;
            transform-style: preserve-3d;
            transform: rotateX(20deg) scale(0.98);
            box-shadow: 
                0 40px 80px -15px rgba(0, 0, 0, 0.95),
                0 15px 30px rgba(0, 0, 0, 0.8),
                inset 0 2px 4px rgba(255, 255, 255, 0.2),
                inset 0 -8px 16px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        @media (max-width: 990px) {
            .device-chassis { grid-template-columns: repeat(3, 1fr); transform: rotateX(10deg); }
        }

        @media (max-width: 600px) {
            .device-chassis { grid-template-columns: repeat(2, 1fr); transform: none; }
        }

        /* تجويف الخانة الواحدة (Cavity Depth) */
        .device-slot {
            background: var(--chassis-cavity);
            height: 200px;
            border-radius: 14px;
            position: relative;
            overflow: hidden;
            box-shadow: 
                inset 0 14px 28px rgba(0, 0, 0, 0.95),
                inset 0 -2px 6px rgba(255, 255, 255, 0.05),
                0 2px 5px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 0, 0, 0.8);
        }

        /* المحتوى الداخلي للخانة (حبة الدواء المجسمة) */
        .slot-inner-bed {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            z-index: 1;
        }

        /* رسم حبة الدواء ثلاثية الأبعاد بـ CSS خالص */
        .realistic-pill {
            width: 24px;
            height: 52px;
            border-radius: 12px;
            background: linear-gradient(to right, #e2e8f0 50%, #0284c7 50%);
            box-shadow: 
                inset 2px 2px 4px rgba(255, 255, 255, 0.6),
                inset -2px -2px 4px rgba(0, 0, 0, 0.5),
                0 8px 16px rgba(0, 0, 0, 0.7);
            transform: rotate(35deg);
            opacity: 0.2;
            transition: all 0.4s;
        }

        .device-slot.has-med .realistic-pill {
            opacity: 1;
            transform: rotate(35deg) scale(1.05);
        }

        .slot-oled-screen {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            color: #94a3b8;
            background: #020408;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            max-width: 85%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* الباب الميكانيكي الانزلاقي الواقعي (Realistic Motorized Lid) */
        .mechanical-lid {
            position: absolute;
            inset: 0;
            background: var(--lid-surface);
            border-radius: 13px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-bottom: 2px solid #000;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 14px 12px;
            box-shadow: 
                0 14px 20px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: transform 0.65s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* خطوط التمسك الميكانيكية للباب (Grip Grooves) */
        .lid-grip-ribs {
            display: flex;
            flex-direction: column;
            gap: 3px;
            align-items: center;
            opacity: 0.35;
        }

        .lid-grip-ribs span {
            width: 32px;
            height: 2px;
            background: #000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .lid-ch-label {
            font-family: 'Plus Jakarta Sans', monospace;
            font-size: 10px;
            font-weight: 800;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        .lid-led-bar {
            width: 100%;
            height: 3px;
            background: #080c14;
            border-radius: 2px;
            box-shadow: inset 0 1px 2px #000;
            transition: all 0.3s;
        }

        .device-slot.active-armed .lid-led-bar {
            background: var(--led-active);
            box-shadow: 0 0 10px var(--led-active);
        }

        .lid-status-screen {
            font-size: 10px;
            font-weight: 700;
            color: #64748b;
        }

        /* حركة فتح السيرفو: الباب ينزلق في المسار ويكشف الحبة */
        .device-slot.open-lid .mechanical-lid {
            transform: translateY(-82%);
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.95);
        }

        /* مصفوفة الكروت والتحكم */
        .controls-matrix {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        @media (max-width: 900px) {
            .controls-matrix { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
            .controls-matrix { grid-template-columns: 1fr; }
        }

        .slot-card {
            background: rgba(18, 24, 38, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-specular);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }

        .slot-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .slot-tag {
            font-family: 'Plus Jakarta Sans', monospace;
            font-size: 11px;
            font-weight: 800;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 3px 8px;
            border-radius: 6px;
        }

        .input-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-row label {
            font-size: 10px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
        }

        .input-row input {
            background: #090e17;
            border: 1px solid var(--border-specular);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
            color: #ffffff;
            outline: none;
            transition: all 0.2s;
        }

        .input-row input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.2);
        }

        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(0.9);
            cursor: pointer;
        }

        .button-strip {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .btn-commit {
            flex: 1;
            background: #0284c7;
            color: #ffffff;
            border: none;
            padding: 9px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-commit:hover { background: #0369a1; }

        .btn-test {
            background: #1e293b;
            border: 1px solid var(--border-specular);
            color: #f1f5f9;
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-test:hover { background: #334155; }

        .status-badge {
            font-size: 10px;
            font-weight: 700;
            color: #10b981;
            display: none;
        }
    </style>
</head>
<body>

<div class="main-shell">
    
    <header class="system-bar">
        <h1 id="txtTitle">البوكس الذكي للأدوية</h1>
        <div class="bar-tools">
            <div class="clock-screen">
                <span class="clock-dot"></span>
                <span id="liveClock">00:00:00</span>
            </div>
            <button class="lang-btn" onclick="toggleLang()" id="btnLang">English</button>
        </div>
    </header>

    <!-- مجسم العلبة الواقعي 3D -->
    <section class="viewport-3d">
        <div class="device-chassis" id="deviceChassis"></div>
    </section>

    <!-- لوحة ضبط الجرعات -->
    <main class="controls-matrix" id="controlsContainer"></main>

</div>

<script>
    const i18n = {
        ar: {
            title: "البوكس الذكي للأدوية",
            btnLang: "English",
            slotTitle: "الخانة",
            lblMed: "اسم الدواء الموصوف",
            lblDose: "الجرعة المحددة",
            lblTime: "ساعة الفتح والتنبيه",
            btnCommit: "تثبيت الجدولة",
            btnTest: "اختبار الباب",
            lidClosed: "مغلق وآمن",
            lidArmed: "مجدول وجاهز",
            lidOpen: "مفتوح للصرف",
            vacant: "شاغر",
            saved: "✓ تم الحفظ والمزامنة",
            alertMissing: "يرجى تحديد اسم الدواء وساعة التنبيه للخانة "
        },
        en: {
            title: "Smart Medication Box",
            btnLang: "العربية",
            slotTitle: "Slot",
            lblMed: "Prescribed Medicine",
            lblDose: "Dosage Amount",
            lblTime: "Dispense Timestamp",
            btnCommit: "Commit Schedule",
            btnTest: "Test Lid",
            lidClosed: "Locked & Safe",
            lidArmed: "Armed / Ready",
            lidOpen: "Dispensing Open",
            vacant: "Vacant",
            saved: "✓ Schedule committed",
            alertMissing: "Please specify medicine name and dispense time for Slot "
        }
    };

    let currentLang = localStorage.getItem('real_med_lang') || 'ar';
    let audioCtx = null;

    function playMechanicalSound() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const now = audioCtx.currentTime;
            
            // صوت تروس المحرك
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(110, now);
            osc.frequency.linearRampToValueAtTime(260, now + 0.35);
            gain.gain.setValueAtTime(0.04, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.4);

            // رنة نقية
            setTimeout(() => {
                const chime = audioCtx.createOscillator();
                const chimeGain = audioCtx.createGain();
                chime.type = 'sine';
                chime.frequency.setValueAtTime(800, audioCtx.currentTime);
                chimeGain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                chimeGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
                chime.connect(chimeGain);
                chimeGain.connect(audioCtx.destination);
                chime.start();
                chime.stop(audioCtx.currentTime + 0.3);
            }, 180);
        } catch(e) {}
    }

    function updateClock() {
        const now = new Date();
        document.getElementById('liveClock').textContent = now.toTimeString().split(' ')[0];
    }
    setInterval(updateClock, 1000);
    updateClock();

    function renderDOM() {
        const chassis = document.getElementById('deviceChassis');
        const controls = document.getElementById('controlsContainer');
        chassis.innerHTML = '';
        controls.innerHTML = '';

        for (let i = 1; i <= 6; i++) {
            const code = i < 10 ? `0${i}` : `${i}`;

            chassis.innerHTML += `
                <div class="device-slot" id="slot-${i}">
                    <div class="slot-inner-bed">
                        <div class="realistic-pill"></div>
                        <div class="slot-oled-screen" id="oled-${i}">---</div>
                    </div>
                    <div class="mechanical-lid">
                        <span class="lid-ch-label">SERVO CH-${code}</span>
                        <div class="lid-grip-ribs"><span></span><span></span><span></span></div>
                        <div>
                            <div class="lid-led-bar" id="led-${i}"></div>
                            <span class="lid-status-screen" id="st-${i}">---</span>
                        </div>
                    </div>
                </div>
            `;

            controls.innerHTML += `
                <article class="slot-card">
                    <div class="slot-card-header">
                        <span class="slot-tag">CH-${code}</span>
                        <span style="font-size:13px; font-weight:700;" id="tag-${i}">---</span>
                    </div>
                    <div class="input-row">
                        <label id="lbl-m-${i}">---</label>
                        <input type="text" id="name-${i}" placeholder="...">
                    </div>
                    <div class="input-row">
                        <label id="lbl-d-${i}">---</label>
                        <input type="text" id="dose-${i}" placeholder="...">
                    </div>
                    <div class="input-row">
                        <label id="lbl-t-${i}">---</label>
                        <input type="time" id="time-${i}">
                    </div>
                    <div class="button-strip">
                        <button class="btn-commit" onclick="saveData(${i})" id="btn-c-${i}">---</button>
                        <button class="btn-test" onclick="toggleLid(${i})" id="btn-t-${i}">---</button>
                    </div>
                    <div class="status-badge" id="badge-${i}">---</div>
                </article>
            `;
        }
    }

    function applyLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('real_med_lang', lang);
        const t = i18n[lang];

        document.documentElement.setAttribute('lang', lang);
        document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');

        document.getElementById('txtTitle').textContent = t.title;
        document.getElementById('btnLang').textContent = t.btnLang;

        for (let i = 1; i <= 6; i++) {
            const code = i < 10 ? `0${i}` : `${i}`;
            document.getElementById(`tag-${i}`).textContent = `${t.slotTitle} ${code}`;
            document.getElementById(`lbl-m-${i}`).textContent = t.lblMed;
            document.getElementById(`lbl-d-${i}`).textContent = t.lblDose;
            document.getElementById(`lbl-t-${i}`).textContent = t.lblTime;
            document.getElementById(`btn-c-${i}`).textContent = t.btnCommit;
            document.getElementById(`btn-t-${i}`).textContent = t.btnTest;
            document.getElementById(`badge-${i}`).textContent = t.saved;
        }

        refreshChassis();
    }

    function toggleLang() {
        applyLanguage(currentLang === 'ar' ? 'en' : 'ar');
    }

    function toggleLid(id) {
        const slot = document.getElementById(`slot-${id}`);
        const st = document.getElementById(`st-${id}`);
        const t = i18n[currentLang];

        playMechanicalSound();
        slot.classList.toggle('open-lid');

        if (slot.classList.contains('open-lid')) {
            st.textContent = t.lidOpen;
        } else {
            const saved = localStorage.getItem(`med_real_${id}`);
            st.textContent = saved ? t.lidArmed : t.lidClosed;
        }
    }

    function saveData(id) {
        const name = document.getElementById(`name-${id}`).value.trim();
        const dose = document.getElementById(`dose-${id}`).value.trim();
        const time = document.getElementById(`time-${id}`).value;
        const t = i18n[currentLang];

        if (!name || !time) {
            alert(t.alertMissing + (id < 10 ? `0${id}` : id));
            return;
        }

        playMechanicalSound();
        const payload = { id, name, dose, time, timestamp: Date.now() };
        localStorage.setItem(`med_real_${id}`, JSON.stringify(payload));

        document.getElementById(`badge-${id}`).style.display = 'block';
        refreshChassis();
    }

    function refreshChassis() {
        const t = i18n[currentLang];

        for (let i = 1; i <= 6; i++) {
            const raw = localStorage.getItem(`med_real_${i}`);
            const slot = document.getElementById(`slot-${i}`);
            const oled = document.getElementById(`oled-${i}`);
            const st = document.getElementById(`st-${i}`);

            if (raw) {
                const data = JSON.parse(raw);
                slot.classList.add('has-med', 'active-armed');
                oled.textContent = `${data.name} (${data.time})`;
                if (!slot.classList.contains('open-lid')) {
                    st.textContent = `${t.lidArmed} • ${data.time}`;
                }
            } else {
                slot.classList.remove('has-med', 'active-armed');
                oled.textContent = t.vacant;
                if (!slot.classList.contains('open-lid')) {
                    st.textContent = t.lidClosed;
                }
            }
        }
    }

    function restoreData() {
        for (let i = 1; i <= 6; i++) {
            const raw = localStorage.getItem(`med_real_${i}`);
            if (raw) {
                const data = JSON.parse(raw);
                document.getElementById(`name-${i}`).value = data.name || '';
                document.getElementById(`dose-${i}`).value = data.dose || '';
                document.getElementById(`time-${i}`).value = data.time || '';
                document.getElementById(`badge-${i}`).style.display = 'block';
            }
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        renderDOM();
        applyLanguage(currentLang);
        restoreData();
    });
</script>
</body>
</html>
